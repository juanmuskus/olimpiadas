<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/signin.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Unicordoba - Olimpiadas Math</title>
  </head>
<body class="text-center">
<main class="form-signin">
  <form>
    <h1 class="h4 mb-3 fw-normal"><img src="img/unicor.png" width="10%" height="10%"> Universidad de Córdoba</h1>
    <p class="text-center"><img src="img/math.png" width="5%" height="5%"> Olimpiadas de Matemáticas</p>
    <div class="form-floating">
      <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
      <label for="floatingInput">Email</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
      <label for="floatingPassword">Contraseña</label>
    </div>

    <button class="w-100 btn btn-lg btn-primary" type="submit"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
    <div class="form-floating mt-2">
    <a href="" class="text-danger"><i class="bi bi-person-plus"></i> Incripción de coord, de IE's</a>
    </div>
    <div class="form-floating mt-4">
      <a href="">Olvidaste tu contraseña ?</a><hr>
    </div>
    <p class="mt-5 mb-3 text-muted"><img src="img/cintia.ico" width="15%" height="15%"> &copy; Desarrollado por CINTIA - 2024</p>
  </form>
</main>
</body>
</html>
