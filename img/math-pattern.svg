    <path d="M170 540 L 320 420"/>
    <path d="M292 378 L 370 476"/>
    <path d="M1160 560 L 1290 430"/>
  </g>

<g fill="#0f4c81" opacity="0.18" font-family="Cambria Math, STIX Two Math, serif">
<text x="80" y="120" font-size="42">∫₀¹ x² dx = 1/3</text>
<text x="420" y="210" font-size="38">d/dx(sin x)=cos x</text>
<text x="1080" y="120" font-size="42">√(x²+9)</text>
<text x="180" y="820" font-size="40">(a+b)²=a²+2ab+b²</text>
<text x="900" y="870" font-size="40">x²+5x+6=(x+2)(x+3)</text>
<text x="980" y="520" font-size="36">lim x→0 sinx/x=1</text>
<text x="600" y="520" font-size="36">∂u/∂t = α∇²u</text>
</g>

</svg>
