      <stop offset="0%" stop-color="#0f4c81"/>
      <stop offset="100%" stop-color="#1d9bf0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#93c5fd" stroke-width="4" fill="none">
